[project]
name = "ai-search-playground"
version = "0.2.0"
description = "Cloudflare Python Workers + FastAPI backend for the AI Search Playground"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
  "pytest",
  "httpx",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
